name: Test

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "project/**"
      - "addon/**"
      - "tools/**"
      - "thirdparty/**"
      - "tests/**"
      - ".gitattributes"
      - ".gitignore"
      - "README.md"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Smoke needs this artifact, not the rest of the release matrix.
  build-linux-release:
    uses: ./.github/workflows/build.yml
    with:
      platform: linux
      flavor: release

  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, linux, windows]
        flavor: [debug, release]
        exclude:
          - platform: linux
            flavor: release
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      flavor: ${{ matrix.flavor }}

  native-tests:
    name: Debug safety checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-key: native-tests
      - name: Run core and validation tool tests
        run: zig build test --summary all

  test:
    name: Linux smoke (Godot ${{ matrix.godot }})
    needs: build-linux-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.7.2", "4.6.3"]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-key: smoke-${{ matrix.godot }}
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot }}
          use-dotnet: false
      - name: Record versions
        run: |
          mkdir -p ci-logs
          { zig version; godot --version; } 2>&1 | tee ci-logs/versions.log
      - name: Install software Vulkan, Xvfb and PulseAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers libvulkan1 pulseaudio pulseaudio-utils libpulse0
      - uses: actions/download-artifact@v4
        with:
          name: hap-video-linux-release
          path: staging
      - name: Install release extension
        run: |
          mkdir -p project/lib
          cp staging/libhap_video.linux.release.x86_64.so project/lib/libhap_video.so
      - name: Reject unresolved Linux symbols
        run: |
          ldd -r project/lib/libhap_video.so 2>&1 | tee ci-logs/ldd.log
          if grep -E 'undefined symbol|not found' ci-logs/ldd.log; then exit 1; fi
      - name: Rendered Vulkan and real PulseAudio PCM smoke
        timeout-minutes: 5
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export VK_ICD_FILENAMES="$VK_DRIVER_FILES" LIBGL_ALWAYS_SOFTWARE=1
          test -f "$VK_DRIVER_FILES"
          cat "$VK_DRIVER_FILES" | tee ci-logs/vulkan-icd.log
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/hap-video-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --version | tee -a ci-logs/versions.log
          pactl --version | tee -a ci-logs/versions.log
          # Keep diagnostics even when startup, setup or the smoke fails.
          pulse_diagnostics() {
            {
              pactl info || true
              pactl list sinks || true
              pactl list sources || true
              pactl list modules || true
            } > ci-logs/pulse-state.log 2>&1
          }
          trap pulse_diagnostics EXIT
          # Use only the native protocol and the test sink, not default.pa's
          # device discovery or idle-suspend policy. --exit-idle-time alone
          # keeps the daemon alive but does not prevent sink suspension while
          # the preceding video smoke uses Dummy audio.
          pulseaudio --start --exit-idle-time=-1 -n --load=module-native-protocol-unix \
            --log-target="file:$PWD/ci-logs/pulseaudio.log"
          ready=false
          for _ in {1..50}; do
            if pactl info > ci-logs/pulse-readiness.log 2>&1; then
              ready=true
              break
            fi
            sleep 0.1
          done
          if [[ "$ready" != true ]]; then
            cat ci-logs/pulse-readiness.log
            exit 1
          fi
          pactl list short modules > ci-logs/pulse-modules.log
          if grep -E '^[0-9]+[[:space:]]+module-suspend-on-idle([[:space:]]|$)' ci-logs/pulse-modules.log; then
            echo 'PCM smoke requires a sink that stays awake during video smoke' >&2
            exit 1
          fi
          pactl load-module module-null-sink sink_name=hap_smoke rate=48000 channels=2 channel_map=front-left,front-right
          pactl set-default-sink hap_smoke
          pactl set-default-source hap_smoke.monitor
          export PULSE_SINK=hap_smoke PULSE_SOURCE=hap_smoke.monitor
          xvfb-run -a -e ci-logs/xvfb.log -s '-screen 0 640x480x24 -nolisten tcp' \
            zig run tools/smoke.zig -- --log-dir ci-logs --driver vulkan --audio --audio-driver PulseAudio -- --display-driver x11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-linux-godot-${{ matrix.godot }}
          path: ci-logs/*.log
          if-no-files-found: warn

  build-smoke-gate:
    name: Build & Smoke (all)
    needs: [build, build-linux-release, native-tests, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Require builds, native tests, and smoke tests to pass
        env:
          BUILD: ${{ needs.build.result }}
          LINUX_RELEASE: ${{ needs.build-linux-release.result }}
          NATIVE: ${{ needs.native-tests.result }}
          SMOKE: ${{ needs.test.result }}
        run: |
          echo "build=$BUILD linux-release=$LINUX_RELEASE native-tests=$NATIVE smoke=$SMOKE"
          test "$BUILD" = success
          test "$LINUX_RELEASE" = success
          test "$NATIVE" = success
          test "$SMOKE" = success
