name: Sanitizers

# Run `zig build test` on every PR and nightly:
# - debug_safety: -Dtest-optimize=debug enables Zig runtime safety checks,
#   including bounds and overflow checks.
# - ubsan: -Dtest-optimize=debug -Dsanitize-c=full adds UndefinedBehaviorSanitizer
#   to the vendored C/C++ (hap, minimp4, snappy).
# This workflow has no AddressSanitizer or ThreadSanitizer lane.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sanitize:
    name: ${{ matrix.lane.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lane:
          - name: Debug safety checks
            flags: -Dtest-optimize=debug
          - name: UBSan
            flags: -Dtest-optimize=debug -Dsanitize-c=full

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run core tests
        run: zig build test ${{ matrix.lane.flags }} --summary all
