name: Build

on:
  workflow_call:
    inputs:
      platform:
        description: "Target platform (linux, macos, or windows)"
        type: string
        required: true
      flavor:
        description: "Build flavor (debug or release)"
        type: string
        required: true
      ref:
        description: "Source ref to build (defaults to the caller's SHA)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ inputs.platform }} ${{ inputs.flavor }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLATFORM: ${{ inputs.platform }}
      FLAVOR: ${{ inputs.flavor }}
    steps:
      - name: Configure build
        run: |
          case "$PLATFORM" in
            linux) target_os=linux-gnu.2.31 ;;
            macos) target_os=macos ;;
            windows) target_os=windows-gnu ;;
            *) printf 'Unsupported platform: %q\n' "$PLATFORM" >&2; exit 1 ;;
          esac
          case "$FLAVOR" in
            debug) mode=safe ;;
            release) mode=fast ;;
            *) printf 'Unsupported flavor: %q\n' "$FLAVOR" >&2; exit 1 ;;
          esac
          printf 'TARGET_OS=%s\nMODE=%s\n' "$target_os" "$mode" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-key: ${{ inputs.platform }}-${{ inputs.flavor }}
      - name: Build targets
        id: build
        run: |
          mkdir -p staging ci-logs
          if [[ "$PLATFORM" = macos ]]; then
            mkdir -p macos-slices
          fi
          for arch in x86_64 aarch64; do
            target="$arch-$TARGET_OS"
            zig build "-Dtarget=$target" "-Doptimize=$MODE" --summary all 2>&1 | tee "ci-logs/$target-$MODE.log"
            asset_arch=$arch
            if [[ "$arch" = aarch64 ]]; then
              asset_arch=arm64
            fi
            case "$PLATFORM" in
              linux)
                cp project/lib/libhap_video.so "staging/libhap_video.linux.$FLAVOR.$asset_arch.so"
                ;;
              macos)
                # Keep thin slices out of the release artifact.
                cp project/lib/libhap_video.dylib "macos-slices/$arch.dylib"
                ;;
              windows)
                cp project/lib/hap_video.dll "staging/hap_video.windows.$FLAVOR.$asset_arch.dll"
                ;;
            esac
          done
      - name: Combine and verify macOS slices
        if: inputs.platform == 'macos'
        run: |
          if ! command -v llvm-lipo-18 >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y llvm-18
          fi
          output="staging/libhap_video.macos.$FLAVOR.dylib"
          llvm-lipo-18 -create macos-slices/aarch64.dylib macos-slices/x86_64.dylib -output "$output"
          for arch in arm64 x86_64; do
            llvm-lipo-18 "$output" -verify_arch "$arch"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hap-video-${{ inputs.platform }}-${{ inputs.flavor }}
          path: staging/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome != 'skipped'
        with:
          name: build-logs-${{ inputs.platform }}-${{ inputs.flavor }}
          path: ci-logs/*.log
          if-no-files-found: warn
          retention-days: 1
